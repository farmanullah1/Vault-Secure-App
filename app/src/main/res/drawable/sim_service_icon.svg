<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>SIM Service app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3035"/>
      <stop offset="1" stop-color="#1C1D21"/>
    </linearGradient>
    <linearGradient id="squircle" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F1F2F4"/>
      <stop offset="0.55" stop-color="#D9DCE1"/>
      <stop offset="1" stop-color="#BFC3CA"/>
    </linearGradient>
    <linearGradient id="sim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#232427"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.35" stop-color="#F7B84A"/>
      <stop offset="0.7" stop-color="#EE8E2A"/>
      <stop offset="1" stop-color="#C96A16"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="simShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark charcoal presentation background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Light gray squircle container -->
  <rect x="152" y="152" width="720" height="720" rx="210" fill="url(#squircle)" filter="url(#shadow)"/>
  <rect x="156" y="156" width="712" height="712" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Matte black SIM card with angled top-right notch (centered via translate) -->
  <g transform="translate(0 52)">
  <g filter="url(#simShadow)">
    <path d="M375 255 H585 L665 335 V645 Q665 665 645 665 H375 Q355 665 355 645 V275 Q355 255 375 255 Z"
          fill="url(#sim)" stroke="url(#sim)" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <path d="M375 262 H582 L658 338 V645 Q658 658 645 658 H375 Q362 658 362 645 V275 Q362 262 375 262 Z"
        fill="none" stroke="#3A3C41" stroke-opacity="0.6" stroke-width="2.5"/>

  <!-- Gold and orange chip contact pad (centered on the card) -->
  <g transform="translate(0 -27)">
    <rect x="417" y="402" width="190" height="170" rx="28" fill="url(#gold)"/>
    <rect x="417" y="402" width="190" height="170" rx="28" fill="none" stroke="#A3540F" stroke-opacity="0.7" stroke-width="3"/>
    <!-- sub-divided segment lines -->
    <g stroke="#8A4710" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M417 459 H472 M552 459 H607"/>
      <path d="M417 515 H472 M552 515 H607"/>
      <path d="M472 402 V459 M552 402 V459"/>
      <path d="M472 515 V572 M552 515 V572"/>
      <rect x="472" y="459" width="80" height="56" rx="12"/>
    </g>
    <!-- metallic sheen -->
    <rect x="417" y="402" width="190" height="170" rx="28" fill="url(#sheen)" opacity="0.7"/>
    <path d="M440 414 H584" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  </g>
  </g>
</svg>
